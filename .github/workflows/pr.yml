name: PR Validation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      tests: ${{ steps.filter.outputs.tests }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'wlanstart.sh'
              - 'healthcheck.sh'
              - 'scripts/**'
              - 'lib/**'
            dockerfile:
              - 'Dockerfile'
            tests:
              - 'tests/**'
            workflow:
              - '.github/workflows/pr.yml'

  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.tests == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bats
        uses: bats-core/bats-action@77d6fb60505b4d0d1d73e48bd035b55074bbfb43 # v4.0.0
        with:
          support-install: false
          assert-install: false
          detik-install: false
          file-install: false

      - name: Run Bats tests
        run: bats tests/

  validate-matrix:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: valid-defaults
            env-vars: INTERFACE=wlan0 SSID=testnet WPA_PASSPHRASE=supersecret COUNTRY_CODE=US CHANNEL=6
            expect-exit: 0
          - name: invalid-channel
            env-vars: INTERFACE=wlan0 COUNTRY_CODE=US CHANNEL=13 SSID=x WPA_PASSPHRASE=supersecret
            expect-exit: 1
          - name: short-passphrase
            env-vars: INTERFACE=wlan0 WPA_PASSPHRASE=short
            expect-exit: 1
          - name: bad-dhcp-range
            env-vars: INTERFACE=wlan0 DHCP_RANGE=oops SSID=x WPA_PASSPHRASE=supersecret
            expect-exit: 1
          - name: invalid-subnet
            env-vars: INTERFACE=wlan0 SUBNET=not-an-ip SSID=x WPA_PASSPHRASE=supersecret
            expect-exit: 1
          - name: invalid-ap-addr
            env-vars: INTERFACE=wlan0 AP_ADDR=999.1.1.1 SSID=x WPA_PASSPHRASE=supersecret
            expect-exit: 1
          - name: missing-interface
            env-vars: SSID=x WPA_PASSPHRASE=supersecret
            expect-exit: 1
          - name: mac-filter-without-file
            env-vars: INTERFACE=wlan0 MAC_FILTER=1 SSID=x WPA_PASSPHRASE=supersecret
            expect-exit: 1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate config (${{ matrix.name }})
        shell: bash
        run: |
          set +e
          env ${{ matrix.env-vars }} ./wlanstart.sh --validate > /tmp/validate.out 2> /tmp/validate.err
          code=$?
          echo "exit=$code (expected ${{ matrix.expect-exit }})"
          cat /tmp/validate.err
          if [ "$code" -ne ${{ matrix.expect-exit }} ] ; then
            echo "::error::${{ matrix.name }}: expected exit ${{ matrix.expect-exit }}, got $code"
            exit 1
          fi

  lint:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dockerfile == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile

  shellcheck:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.scripts == 'true' || needs.changes.outputs.tests == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run shellcheck
        run: |
          shellcheck -x wlanstart.sh healthcheck.sh clients.sh

      - name: Shellcheck get-version.sh
        run: shellcheck scripts/get-version.sh

  build:
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.dockerfile == 'true' || needs.changes.outputs.scripts == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image for scanning (amd64, loaded)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ github.repository }}:pr-${{ github.event.pull_request.number }}

      - name: Scan for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Validate multi-arch build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm/v7,linux/arm64
          push: false
