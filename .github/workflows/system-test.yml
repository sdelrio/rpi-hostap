name: System Test

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit id) to test'
        required: false
        default: ''

concurrency:
  group: systest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      tests: ${{ steps.filter.outputs.tests }}
      workflow: ${{ steps.filter.outputs.workflow }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'wlanstart.sh'
              - 'healthcheck.sh'
              - 'lib/**'
            dockerfile:
              - 'Dockerfile'
            tests:
              - 'tests/**'
            workflow:
              - '.github/workflows/system-test.yml'

  system-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.tests == 'true' ||
       needs.changes.outputs.scripts == 'true' ||
       needs.changes.outputs.dockerfile == 'true' ||
       needs.changes.outputs.workflow == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat iproute2 iw busybox \
            "linux-headers-$(uname -r)"

      # The azure runner kernel does not ship mac80211_hwsim, so build it
      # out-of-tree against the running kernel's headers instead.
      - name: Build mac80211_hwsim module
        run: |
          find "/lib/modules/$(uname -r)" \( -name 'mac80211*' -o -name 'cfg80211*' \) | head
          mkdir -p /tmp/hwsim && cd /tmp/hwsim
          for f in mac80211_hwsim.c mac80211_hwsim.h ; do
            for src in \
              "https://raw.githubusercontent.com/torvalds/linux/v6.17/drivers/net/wireless/virtual/$f" \
              "https://raw.githubusercontent.com/torvalds/linux/v6.17/drivers/net/wireless/$f" ; do
              curl -fsSL "$src" -o "$f" && break || true
            done
            [ -s "$f" ] || { echo "failed to fetch $f" >&2; exit 1; }
          done
          printf 'obj-m := mac80211_hwsim.o\n' > Makefile
          make -C "/lib/modules/$(uname -r)/build" M="$PWD" modules

      - name: Load simulated Wi-Fi radio
        run: |
          sudo insmod /tmp/hwsim/mac80211_hwsim.ko radios=1
          lsmod | grep mac80211_hwsim

      - name: Run system test
        run: sudo tests/system_test.sh
