name: System Test

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit id) to test'
        required: false
        default: ''

concurrency:
  group: systest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      tests: ${{ steps.filter.outputs.tests }}
      workflow: ${{ steps.filter.outputs.workflow }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'wlanstart.sh'
              - 'healthcheck.sh'
              - 'lib/**'
            dockerfile:
              - 'Dockerfile'
            tests:
              - 'tests/**'
            workflow:
              - '.github/workflows/system-test.yml'

  system-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.tests == 'true' ||
       needs.changes.outputs.scripts == 'true' ||
       needs.changes.outputs.dockerfile == 'true' ||
       needs.changes.outputs.workflow == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat iproute2 iw busybox \
            linux-generic

      # The runner ships the Azure kernel, which lacks mac80211_hwsim.
      # Remove it so GRUB defaults to the freshly installed generic kernel,
      # which includes the module in linux-modules-extra-generic.
      - name: Remove Azure kernel so generic becomes default
        run: |
          sudo apt-get remove -y --purge 'linux-*azure*'
          sudo update-grub
          grep menuentry /boot/grub/grub.cfg || true

      - name: Reboot into generic kernel
        run: sudo reboot
        continue-on-error: true

      - name: Wait for runner to come back online
        run: sleep 10
        continue-on-error: true

      - name: Load simulated Wi-Fi radio
        run: |
          echo "Current Kernel: $(uname -r)"
          sudo modprobe mac80211_hwsim radios=1
          iw dev

      - name: Run system test
        run: sudo tests/system_test.sh
