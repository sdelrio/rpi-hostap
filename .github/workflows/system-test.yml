name: System Test

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit id) to test'
        required: false
        default: ''

concurrency:
  group: systest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      tests: ${{ steps.filter.outputs.tests }}
      workflow: ${{ steps.filter.outputs.workflow }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'wlanstart.sh'
              - 'healthcheck.sh'
              - 'lib/**'
            dockerfile:
              - 'Dockerfile'
            tests:
              - 'tests/**'
            workflow:
              - '.github/workflows/system-test.yml'

  system-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.tests == 'true' ||
       needs.changes.outputs.scripts == 'true' ||
       needs.changes.outputs.dockerfile == 'true' ||
       needs.changes.outputs.workflow == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      # The azure runner kernel (linux-azure) does not ship mac80211_hwsim and
      # Microsoft does not package it in linux-modules-extra either (see
      # actions/runner-images#1480). Switch to the generic Ubuntu kernel, which
      # includes the module, and reboot into it.
      - name: Install generic Linux kernel and extra modules
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            linux-image-generic \
            linux-modules-extra-generic \
            socat iproute2 iw busybox

      - name: Reboot runner into generic kernel
        run: sudo reboot
        continue-on-error: true

      - name: Wait for runner to come back online
        run: sleep 10

      - name: Load simulated Wi-Fi radio
        run: |
          echo "Current Kernel: $(uname -r)"
          sudo modprobe mac80211_hwsim radios=1
          lsmod | grep mac80211_hwsim
          iw dev

      - name: Run system test
        run: sudo tests/system_test.sh
