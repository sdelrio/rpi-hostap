name: System Test

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (tag or commit id) to test'
        required: false
        default: ''

concurrency:
  group: systest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      scripts: ${{ steps.filter.outputs.scripts }}
      dockerfile: ${{ steps.filter.outputs.dockerfile }}
      tests: ${{ steps.filter.outputs.tests }}
      workflow: ${{ steps.filter.outputs.workflow }}
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            scripts:
              - 'wlanstart.sh'
              - 'healthcheck.sh'
              - 'lib/**'
            dockerfile:
              - 'Dockerfile'
            tests:
              - 'tests/**'
            workflow:
              - '.github/workflows/system-test.yml'

  system-test:
    runs-on: ubuntu-latest
    needs: changes
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.tests == 'true' ||
       needs.changes.outputs.scripts == 'true' ||
       needs.changes.outputs.dockerfile == 'true' ||
       needs.changes.outputs.workflow == 'true')
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y socat iproute2 iw busybox \
            "linux-headers-$(uname -r)"

      # The azure runner kernel does not ship the 802.11 stack at all
      # (no cfg80211/mac80211/mac80211_hwsim), and hosted runners cannot
      # resume a job across a reboot to switch kernels. Build the full
      # wireless stack out-of-tree from the matching stable kernel tag.
      - name: Build wireless stack modules
        run: |
          KVER="$(uname -r)"
          TAG="v$(echo "${KVER}" | grep -oE '^[0-9]+\.[0-9]+')"
          echo "Kernel ${KVER}, building from tag ${TAG}"
          git clone --depth 1 --filter=blob:none --sparse \
            --branch "${TAG}" \
            https://git.kernel.org/pub/scm/linux/kernel/git/stable/linux.git \
            /tmp/linux-src
          cd /tmp/linux-src
          git sparse-checkout set net/wireless net/mac80211 drivers/net/wireless/virtual

          # cfg80211 + mac80211: build via a wrapper external-module tree
          mkdir -p /tmp/wl/net
          cp -r net/wireless net/mac80211 /tmp/wl/net/
          cat > /tmp/wl/Makefile <<'EOF'
          obj-m += net/wireless/ net/mac80211/
          EOF

          # mac80211_hwsim: standalone external module (single .c file)
          mkdir -p /tmp/hwsim-src /tmp/hwsim
          cp drivers/net/wireless/virtual/mac80211_hwsim.c \
             drivers/net/wireless/virtual/mac80211_hwsim.h \
             /tmp/hwsim-src/
          printf 'obj-m := mac80211_hwsim.o\n' > /tmp/hwsim-src/Makefile

          KDIR="/lib/modules/${KVER}/build"
          make -C "${KDIR}" M="/tmp/wl" \
            CONFIG_CFG80211=m CONFIG_MAC80211=m modules
          make -C "${KDIR}" M="/tmp/hwsim-src" CONFIG_MAC80211_HWSIM=m modules

          cp /tmp/wl/net/wireless/cfg80211.ko \
             /tmp/wl/net/mac80211/mac80211.ko \
             /tmp/hwsim-src/mac80211_hwsim.ko \
             /tmp/hwsim/
          ls -l /tmp/hwsim

      - name: Load simulated Wi-Fi radio
        run: |
          sudo insmod /tmp/hwsim/cfg80211.ko
          sudo insmod /tmp/hwsim/mac80211.ko
          sudo insmod /tmp/hwsim/mac80211_hwsim.ko radios=1
          lsmod | grep -E 'cfg80211|mac80211'
          iw dev

      - name: Run system test
        run: sudo tests/system_test.sh
